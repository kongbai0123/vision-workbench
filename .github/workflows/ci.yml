name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Verify desktop startup checks and native startup without models
        run: |
          python scripts/check_runtime.py --report qa-output/startup/runtime.json
          python tests/desktop_startup.py

      - name: Check Python correctness rules
        run: |
          python -m pip install 'ruff>=0.11,<1'
          python -m ruff check workbench src composer_core sam2_segmentation classical_segmentation scripts tests

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Verify single-click Git update, backup and restart workflow
        run: python tests/desktop_update_workflow.py

      - name: Verify training desktop workflow
        run: python tests/desktop_training.py

      - name: Verify review to training setup without training
        run: python tests/desktop_setup_workflow.py

      - name: Verify review desktop workflow
        run: python tests/desktop_review.py

      - name: Verify camera settings and preview workflow
        run: python tests/desktop_camera_preview.py

      - name: Verify external model import and layout
        run: python tests/desktop_model_import.py

      - name: Verify model report tabs, scroll and downloads
        run: python tests/desktop_model_layout.py

      - name: Verify multilabel split workflow
        run: python tests/desktop_multilabel_split.py

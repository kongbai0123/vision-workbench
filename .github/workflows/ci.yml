name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check Python correctness rules
        run: |
          python -m pip install 'ruff>=0.11,<1'
          python -m ruff check workbench src composer_core sam2_segmentation classical_segmentation tests

      - name: Run JavaScript tests
        run: node --test tests/*.test.mjs

      - name: Verify training desktop workflow
        run: python tests/desktop_training.py

      - name: Verify review desktop workflow
        run: python tests/desktop_review.py

      - name: Verify camera settings and preview workflow
        run: python tests/desktop_camera_preview.py

      - name: Verify external model import and layout
        run: python tests/desktop_model_import.py

      - name: Verify multilabel split workflow
        run: python tests/desktop_multilabel_split.py

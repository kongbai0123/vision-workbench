[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-workbench"
dynamic = ["version", "dependencies"]
requires-python = ">=3.10"
description = "Local vision annotation and training workbench"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.dynamic]
version = {attr = "workbench.__version__"}
dependencies = {file = "requirements.txt"}

[tool.setuptools]
packages = ["vision_workbench", "vision_workbench.contracts", "workbench", "composer_core", "sam2_segmentation", "classical_segmentation"]
package-dir = {vision_workbench = "src/vision_workbench"}

[tool.setuptools.package-data]
workbench = ["migrations/*.sql"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", "venv", "data", "models", "runtime"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
